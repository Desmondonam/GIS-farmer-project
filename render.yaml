services:
  - type: web
    name: agri-intelligence-api
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: LIVE_DATA_MODE
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
